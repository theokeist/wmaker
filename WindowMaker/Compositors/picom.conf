# Window Maker optimized Picom configuration
# Provides smooth transitions, soft ambient shadows, and gentle background blur.
# Dock & Clip transparency is dynamically managed by Window Maker via _NET_WM_WINDOW_OPACITY.

# --- Rendering Backend ---
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# --- Window Shadows ---
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name *= 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Fading Animations ---
fading = true;
fade-delta = 6;
fade-in-step = 0.05;
fade-out-step = 0.05;

# --- Rounded Corners ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name *= 'Notification'",
  "class_g = 'Wmaker'",
  "class_g = 'wmaker'"
];

# --- Background Blur ---
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Opacity & Focus ---
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- Window Type Specifications ---
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
};
